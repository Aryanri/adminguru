{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Gurava Logo" style="width: 64px; height: 64px; object-fit: contain;" class="mb-3">
                <h3 class="fw-bold text-primary">Gurava</h3>
                <p class="text-muted fw-bold">AI Hadir, Bebas Repot, Guru Hebat Bebas Beban.</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3"><i class="fa fa-sign-in-alt me-2"></i>Login Sistem</button>
            </form>
            <div class="text-center mt-2">
                <p class="small text-muted">Belum punya akun? <a href="{{ url_for('register') }}">Daftar Mandiri</a></p>
                <p class="small">Lupa password? Hubungi Admin via WA: <a href="https://wa.me/6281321984848?text=Halo%20Admin,%20saya%20lupa%20password%20akun%20saya." target="_blank" class="text-success fw-bold"><i class="fab fa-whatsapp"></i> 081321984848</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
