{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3 text-primary">Pendaftaran Mandiri Guru</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap & Gelar</label>
                    <input type="text" name="nama_lengkap" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2"><i class="fab fa-whatsapp me-2"></i>Daftar Sekarang & Konfirmasi WA</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}">Kembali ke Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
